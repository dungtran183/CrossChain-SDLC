# Deploy frontend ở chế độ replay (không cần backend) lên GitHub Pages: https://<owner>.github.io/<repo>/
# Tự động mỗi lần push lên main (hoặc chạy tay: Actions → Deploy demo → Run workflow).
# Bản build được đẩy lên nhánh gh-pages; GitHub Pages phục vụ nhánh này (Settings → Pages → Deploy from a branch → gh-pages).
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check replay files
        run: python3 scripts/check_replays.py
      - name: Build (replay mode)
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build:replay
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Publish to gh-pages branch
        working-directory: frontend/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="${{ github.repository_owner }}" -c user.email="${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com" \
            commit -q -m "deploy: ${{ github.sha }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" gh-pages
