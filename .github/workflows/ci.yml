name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
        working-directory: frontend
      - name: Build replay mode (GitHub Pages)
        run: npm run build:replay
        working-directory: frontend
      - name: Check replay files
        run: python3 scripts/check_replays.py
      - name: UI smoke test (replay build, Playwright)
        working-directory: frontend
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run smoke

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile
        working-directory: contracts
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run compile
      - name: Artifacts are committed and up to date
        run: git diff --exit-code -- contracts/artifacts
